name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the write-once guard diffs a commit RANGE, so both
          # the base commit and every commit reaching it must be present.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema requests pytest

      - name: Run pytest suite (parser/grammar/identity/replay/frequencies/refresh/fetch/backfill)
        # PYTHONPATH=pipeline is required so `import bc_pipeline` resolves without an
        # install -- see pipeline/tests/conftest.py and the README's "Testing" note.
        # Covers both suites: repo-root tests/ (parse/grammar/identity/replay/serialize)
        # and pipeline/tests/ (fetch/backfill/completeness/frequencies/refresh/config).
        run: PYTHONPATH=pipeline python -m pytest tests pipeline/tests -q

      - name: Validate game files against the schema
        run: python scripts/validate_games.py

      - name: Check frozen schema invariants
        run: python scripts/check_schema_invariants.py

      - name: Validate frequency artifact against its schema
        run: python scripts/validate_frequencies.py

      - name: Check derived artifacts are current with games/**
        # A schema check passes on a perfectly well-formed STALE artifact --
        # which is how artifacts/latest/frequencies.json sat unnoticed across
        # reparse(v0.4.0). This regenerates each artifact in memory and
        # compares (generated_at normalized) against what is committed.
        run: python scripts/check_artifacts_current.py

      - name: Enforce the games/** write-once contract
        # Caller-contract clause 1: a final game file changes only in a
        # labeled `reparse(vX.Y.Z):` commit. On a PR the range is base..head;
        # on a push it is before..after (all-zero `before` on a branch's first
        # push makes the guard skip cleanly).
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_write_once.py
